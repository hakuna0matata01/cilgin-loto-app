name: Haftalik Loto Veri Guncelleme

# Cekilis gunleri Pazartesi/Carsamba/Cumartesi 21:30 (Turkiye, UTC+3).
# Sonuclarin siteye yansimasi icin ~1 saat pay birakilarak
# 22:45 TR = 19:45 UTC olarak ayarlandi. GitHub Actions cron UTC kullanir.
on:
  schedule:
    - cron: "45 19 * * 1,3,6"   # Pazartesi, Carsamba, Cumartesi
  workflow_dispatch: {}          # Manuel calistirma icin

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Veriyi guncelle ve yeni kupon uret
        run: python scripts/update_data.py

      - name: Degisiklikleri commit'le
        run: |
          git config user.name "loto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/loto.db
          git diff --staged --quiet || git commit -m "chore: haftalik otomatik veri guncellemesi"
          git push
